# 100-step smoke gate for Phase 2 (excludes en_wiki/en_finemath until they finish tokenizing)
run_name: moe0-9b-a0-2b-phase02-smoke
model:
  n_layers: 16
  d_model: 1024
  vocab_size: 49280
  tie_embeddings: true
  max_seq_len: 2048
  norm_eps: 1.0e-06
  attention:
    n_heads: 16
    head_dim: 64
    n_kv_heads: 4
    qk_norm: true
    rope_theta: 10000
    output_gate: true
    bias: false
  moe:
    n_experts: 64
    top_k: 8
    expert_hidden: 256
    activation: silu
    router_init_std: 0.02
    backend: auto
    load_balance_coef: 0.01
    router_z_loss_coef: 0.001
  init:
    std: 0.02
optimizer:
  muon:
    lr: 0.0006
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    weight_decay: 0.1
  adamw:
    lr: 0.0006
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 2000
  decay: cosine
  min_lr_ratio: 0.1
  wsd_decay_frac: 0.2
training:
  dataset: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  total_tokens: 10000000000
  seq_len: 2048
  global_batch_tokens: 524288
  micro_batch: 16
  precision: bf16
  compile: true
  checkpoint_every: 1000000
  log_every: 10
  expert_hist_every: 100
  attn_logit_every: 100
data:
  data_dir: /lambda/nfs/h100-f1/data
  checkpoint_dir: /lambda/nfs/h100-f1/checkpoints
tokenizer:
  path: ./bubblspace-tokenizer
  doc_separator: <|endoftext|>
wandb:
  project: moe0-9b-a0-2b
  entity: null
phase2:
  step_offset: 19073
  wandb_group: moe0-9b-a0-2b
  total_steps: 100
  decay_start_step: 70
  warmup_steps: 40
  start_lr: 6.0e-05
  peak_lr: 0.00024
  end_lr: 6.0e-06
  doc_mask: true
  fim_rate: 0.5
  val_every: 50
  val_tokens_per_pool: 2097152
  pools:
    en_cosmo:
      path: /lambda/nfs/h100-f1/data/phase2/en_cosmo
      group: english
      weight: 1.5
    en_fineweb:
      path: /lambda/nfs/h100-f1/data
      group: english
      weight: 0.8
      recursive: false
    code_python_edu:
      path: /lambda/nfs/h100-f1/data/phase2/code_python_edu
      group: code
      fim: true
    code_starcoder_python:
      path: /lambda/nfs/h100-f1/data/phase2/code_starcoder_python
      group: code
      fim: true
    code_starcoder_typescript:
      path: /lambda/nfs/h100-f1/data/phase2/code_starcoder_typescript
      group: code
      fim: true
    code_starcoder_javascript:
      path: /lambda/nfs/h100-f1/data/phase2/code_starcoder_javascript
      group: code
      fim: true
    code_starcoder_go:
      path: /lambda/nfs/h100-f1/data/phase2/code_starcoder_go
      group: code
      fim: true
    code_starcoder_sql_shell_cfg:
      path: /lambda/nfs/h100-f1/data/phase2/code_starcoder_sql_shell_cfg
      group: code
      fim: true
    agentic_toolmind:
      path: /lambda/nfs/h100-f1/data/phase2/agentic_toolmind
      group: agentic
      kind: block
    agentic_glaive_fc_v2:
      path: /lambda/nfs/h100-f1/data/phase2/agentic_glaive_fc_v2
      group: agentic
      kind: block
    agentic_openthoughts:
      path: /lambda/nfs/h100-f1/data/phase2/agentic_openthoughts
      group: agentic
      kind: block
    agentic_hermes:
      path: /lambda/nfs/h100-f1/data/phase2/agentic_hermes
      group: agentic
      kind: block
    agentic_bespoke_stratos:
      path: /lambda/nfs/h100-f1/data/phase2/agentic_bespoke_stratos
      group: agentic
      kind: block
    contrastive:
      path: /lambda/nfs/h100-f1/data/phase2/contrastive
      group: contrastive
  stages:
  - until_step: 50
    groups:
      english: 0.415
      code: 0.49
      agentic: 0.08
      contrastive: 0.015
  - until_step: 100
    groups:
      english: 0.34
      code: 0.38
      agentic: 0.22
      contrastive: 0.06
    boost:
      en_fineweb: 0.0
      code_python_edu: 3.0
