# Phase 4 RL smoke test: 20 steps of configs/rl_v1.yaml (same settings); logged to W&B as Phase4_rl_smoke
# init: the SFT winner (run 01 or run 02b, decided after the run 02b evals); fill in init_checkpoint + vllm_model_dir.
run_name: Phase4_rl_smoke
out_dir: /lambda/nfs/h100-f1/checkpoints/Phase4_rl_smoke
model_config: configs/phase3_run02b.yaml          # architecture (same for every Phase 3 run)
init_checkpoint: /lambda/nfs/h100-f1/checkpoints/Phase3_run02b/step_1500.pt   # TO CONFIRM after the run 02b evals
vllm_model_dir: /home/ubuntu/vllm_models/Phase3_run02b-step1500               # scripts/make_vllm_model_dir.py of the same weights
tasks: /home/ubuntu/rl_tasks/filtered_rl_v1.jsonl                              # scripts/rl_filter.py output for the chosen SFT model
wandb_project: moe0-9b-a0-2b
seed: 0

steps: 20
prompts_per_step: 64
n_samples: 8
max_tokens: 1024
temperature: 1.0
top_p: 1.0
max_model_len: 6144
vllm_gpu_mem: 0.3

lr: 1.0e-6
warmup_steps: 10
betas: [0.9, 0.99]
weight_decay: 0.0
grad_clip: 1.0
clip_eps: 0.2
kl_beta: 0.02
adv_std_norm: true
ppo_epochs: 1
micro_batch_tokens: 32768

area_weights:          # share of prompts per step
  maths: 0.16
  time: 0.11
  ifeval: 0.09          # Tülu RLVR constraints (only the constraint is checkable)
  ifeval_answer: 0.08   # constraint + known answer: both must hold (27 Nov fix)
  code: 0.15
  tool: 0.18            # raised 27 Nov: run 02b lost BFCL no-tool-needed (75% -> 59%), multiple and parallel calls
  binding: 0.10
  refusal: 0.13         # now incl. harmful-sounding but harmless prompts (expect an answer)

val_per_area: 40
eval_every: 10
save_every: 20
sandbox_workers: 16
