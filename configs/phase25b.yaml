# ============================================================
# MoE-0.9B-A0.2B v2  —  PHASE 2.5b: context extension 2048 -> 16,384 (~1.5B tokens)
# Qwen3-Next-inspired, single H100 80GB, Muon + AdamW
# ============================================================

run_name: moe0-9b-a0-2b-phase025b

model:
  n_layers: 16
  d_model: 1024
  vocab_size: 49280          # bubblspace-tokenizer real length 49164, padded to a multiple of 128
  tie_embeddings: true
  max_seq_len: 16384          # 2.5b: 8x the trained context
  norm_eps: 1.0e-6

  attention:
    n_heads: 16
    head_dim: 64
    n_kv_heads: 4
    qk_norm: true
    rope_theta: 1000000        # 2.5b: RoPE base raised (ABF) so 16k positions fall in familiar angle ranges
    output_gate: true
    bias: false

  moe:
    n_experts: 64
    top_k: 8
    expert_hidden: 256
    activation: silu
    router_init_std: 0.02
    backend: auto              # auto | grouped_mm | fallback — resolved at startup by probing torch._grouped_mm
    load_balance_coef: 0.01
    router_z_loss_coef: 0.001

  init:
    std: 0.02
    # residual_proj_std = std / sqrt(2 * n_layers), applied to attn.o_proj and experts.W_down

optimizer:
  muon:
    lr: 6.0e-4
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    weight_decay: 0.1
  adamw:
    lr: 6.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1
  grad_clip: 1.0

schedule:
  warmup_steps: 2000
  decay: cosine               # cosine | wsd
  min_lr_ratio: 0.1
  wsd_decay_frac: 0.2         # only used when decay: wsd

training:
  dataset: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  total_tokens: 10_000_000_000
  seq_len: 16384
  global_batch_tokens: 524288
  micro_batch: 2              # 2 x 16,384 = same tokens per micro-batch as 16 x 2,048
  precision: bf16
  compile: true
  checkpoint_every: 1000
  log_every: 10
  expert_hist_every: 100
  attn_logit_every: 100

data:
  data_dir: /lambda/nfs/h100-f1/data
  checkpoint_dir: /lambda/nfs/h100-f1/checkpoints

tokenizer:
  path: ./bubblspace-tokenizer
  doc_separator: "<|endoftext|>"

wandb:
  project: moe0-9b-a0-2b
  entity: null

# ------------------------------------------------------------
# Phase 2.5b (DRAFT): continue from the Phase 2.5a final checkpoint via --init_from.
# Context 16,384 with RoPE base 1e6; ~35% naturally long documents (8k-16k+), ~65% short replay
# from the 2.5a mix with doc masking. Agentic pools (packed as 2,048-token blocks) are included at 5%:
# each 16k sample joins 8 random blocks, and pads become document boundaries (src/data/dataset.py, _Pool).
# Long pools are built with scripts/extract_long_docs.py (min 4,096 tokens) before launch.
# Plan: doc/plan-03-phase-2.5-knowledge-context.md §3
# ------------------------------------------------------------
phase2:
  step_offset: 71684          # after Phase 1 (19,073) + Phase 2 (22,888) + Phase 2.5a (29,723, early decay; was 38,147 -> 80108)
  wandb_group: moe0-9b-a0-2b
  total_steps: 2861           # ~1.5B tokens at 524,288 tokens/step
  decay_start_step: 200       # warmup then linear decay (no plateau)
  warmup_steps: 200
  start_lr: 6.0e-6
  peak_lr: 1.0e-4
  end_lr: 1.0e-5
  doc_mask: true
  fim_rate: 0.5
  val_every: 100
  val_tokens_per_pool: 2097152

  pools:
    # Long documents (>= 4,096 tokens) — 35%
    long_fineweb:  {path: /lambda/nfs/h100-f1/data/phase25b/long_fineweb,  group: long_fineweb}
    long_wiki:     {path: /lambda/nfs/h100-f1/data/phase25b/long_wiki,     group: long_wiki}
    long_code:     {path: /lambda/nfs/h100-f1/data/phase25b/long_code,     group: long_code, fim: true}
    long_finemath: {path: /lambda/nfs/h100-f1/data/phase25b/long_finemath, group: long_finemath}
    # Short replay from the 2.5a mix — 65%
    en_wiki_full:   {path: /lambda/nfs/h100-f1/data/phase25_decon/en_wiki_full,  group: wiki}
    fact_seeking:   {path: /lambda/nfs/h100-f1/data/phase25_decon/fact_seeking,  group: fact_seeking}
    synth_en:       {path: /lambda/nfs/h100-f1/data/phase25_decon/synth_en,      group: synth}
    fwe_edu4:       {path: /lambda/nfs/h100-f1/data/phase25_decon/fwe_edu4,      group: fwe_edu4}
    code_python_edu_fresh:       {path: /lambda/nfs/h100-f1/data/phase25_decon/code_python_edu_fresh,       group: code_fresh, fim: true}
    code_starcoder_python_fresh: {path: /lambda/nfs/h100-f1/data/phase25_decon/code_starcoder_python_fresh, group: code_fresh, fim: true}
    code_starcoder_js_fresh:     {path: /lambda/nfs/h100-f1/data/phase25_decon/code_starcoder_js_fresh,     group: code_fresh, fim: true}
    code_starcoder_ts_fresh:     {path: /lambda/nfs/h100-f1/data/phase25_decon/code_starcoder_ts_fresh,     group: code_fresh, fim: true}
    code_python_edu:             {path: /lambda/nfs/h100-f1/data/phase2/code_python_edu,             group: code_replay, fim: true}
    code_starcoder_python:       {path: /lambda/nfs/h100-f1/data/phase2/code_starcoder_python,       group: code_replay, fim: true}
    contrastive_v3:  {path: /lambda/nfs/h100-f1/data/phase25_decon/contrastive_v3,  group: contrastive_v3}
    relational_llm:  {path: /lambda/nfs/h100-f1/data/phase25_decon/relational_llm,  group: relational_llm}
    nli_commonsense: {path: /lambda/nfs/h100-f1/data/phase25_decon/nli_commonsense, group: nli_commonsense}
    kg_text:         {path: /lambda/nfs/h100-f1/data/phase25_decon/kg_text,         group: kg_text}
    en_finemath:     {path: /lambda/nfs/h100-f1/data/phase2/en_finemath,     group: math}
    # Agentic / tool-call replay (added 25 Nov) so 2.5b's re-warm doesn't undo function calling before Phase 3 SFT
    agentic_toolmind:        {path: /lambda/nfs/h100-f1/data/phase2/agentic_toolmind,        group: agentic, kind: block}
    agentic_glaive_fc_v2:    {path: /lambda/nfs/h100-f1/data/phase2/agentic_glaive_fc_v2,    group: agentic, kind: block}
    agentic_openthoughts:    {path: /lambda/nfs/h100-f1/data/phase2/agentic_openthoughts,    group: agentic, kind: block}
    agentic_hermes:          {path: /lambda/nfs/h100-f1/data/phase2/agentic_hermes,          group: agentic, kind: block}
    agentic_bespoke_stratos: {path: /lambda/nfs/h100-f1/data/phase2/agentic_bespoke_stratos, group: agentic, kind: block}

  stages:
    - until_step: 2861
      groups:
        long_fineweb: 0.12
        long_wiki: 0.08
        long_code: 0.12
        long_finemath: 0.03
        wiki: 0.124       # was 0.154; -0.03 to agentic
        fact_seeking: 0.10  # was 0.12; -0.02 to agentic
        synth: 0.075
        fwe_edu4: 0.06
        code_fresh: 0.13
        code_replay: 0.045
        contrastive_v3: 0.03
        relational_llm: 0.005
        nli_commonsense: 0.005
        kg_text: 0.001
        math: 0.025
        agentic: 0.05     # added 25 Nov (≈75M tokens, ≈0.2 passes over the 375M agentic pools)
