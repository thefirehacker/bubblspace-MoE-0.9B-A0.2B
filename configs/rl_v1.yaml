# Phase 4 RL v1: GRPO with verifiable rewards (doc/plan-06-phase-4-rl.md, doc/rl-primer-phase4.md)
# init: the SFT winner (run 01 or run 02b, decided after the run 02b evals); fill in init_checkpoint + vllm_model_dir.
run_name: Phase4_rl_v1
out_dir: /lambda/nfs/h100-f1/checkpoints/Phase4_rl_v1
model_config: configs/phase3_run02b.yaml          # architecture (same for every Phase 3 run)
init_checkpoint: /lambda/nfs/h100-f1/checkpoints/Phase3_run02b/step_1500.pt   # TO CONFIRM after the run 02b evals
vllm_model_dir: /home/ubuntu/vllm_models/Phase3_run02b-step1500               # scripts/make_vllm_model_dir.py of the same weights
tasks: /home/ubuntu/rl_tasks/filtered_rl_v1.jsonl                              # scripts/rl_filter.py output for the chosen SFT model
wandb_project: moe0-9b-a0-2b
seed: 0

steps: 500
prompts_per_step: 64
n_samples: 8
max_tokens: 1024
temperature: 1.0
top_p: 1.0
max_model_len: 6144
vllm_gpu_mem: 0.3

lr: 1.0e-6
warmup_steps: 10
betas: [0.9, 0.99]
weight_decay: 0.0
grad_clip: 1.0
clip_eps: 0.2
kl_beta: 0.02
adv_std_norm: true
ppo_epochs: 1
micro_batch_tokens: 32768

area_weights:          # share of prompts per step
  maths: 0.20
  time: 0.12
  ifeval: 0.18
  code: 0.15
  tool: 0.12
  binding: 0.10
  refusal: 0.13

val_per_area: 40
eval_every: 25
save_every: 100
sandbox_workers: 16
